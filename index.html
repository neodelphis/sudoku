<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Sudoku Photo — corrige ta grille du journal</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <header id="topbar">
      <h1>📸 Sudoku Photo</h1>
      <p class="subtitle">Photographie ta grille, vois la solution.</p>
    </header>

    <section id="capture-zone">
      <div id="preview-wrap" class="hidden">
        <canvas id="preview"></canvas>
        <canvas id="overlay" class="hidden"></canvas>
      </div>
      <div id="placeholder">
        <div class="placeholder-icon">🧩</div>
        <p>Prends la grille en photo<br />elle sera reconnue automatiquement</p>
      </div>
      <input type="file" id="file-input" accept="image/*" capture="environment" class="hidden" />
      <div id="actions">
        <button id="btn-photo" class="btn primary">📷 Prendre une photo</button>
        <button id="btn-gallery" class="btn">🖼️ Galerie</button>
        <button id="btn-demo" class="btn ghost">✨ Essayer avec une grille de démo</button>
      </div>
      <div id="status" class="hidden">
        <div class="spinner"></div>
        <span id="status-text">Chargement du modèle…</span>
      </div>
    </section>

    <section id="result-zone" class="hidden">
      <div id="grid-wrap">
        <canvas id="grid-canvas" width="450" height="450"></canvas>
      </div>
      <div id="grid-actions">
        <button id="btn-solve" class="btn primary">✅ Voir la correction</button>
        <button id="btn-clear" class="btn ghost">🗑️ Nouvelle photo</button>
      </div>
      <p id="error-msg" class="hidden"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/ort.min.js" crossorigin="anonymous"></script>
  <script src="js/solver.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/vision.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
